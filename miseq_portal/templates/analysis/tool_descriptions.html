<div class="collapse" id="toolDescriptions">
  <div class="card">
    <div class="card-header">
      A number of tools are available to process existing datasets:
    </div>
    <ol class="list-group list-group-flush">
      {% for key, value in tool_list.items %}
        <li class="list-group-item">
          <h5>{{ value.title }}</h5>
          <p>{{ value.description }}</p>
      </li>
    {% endfor %}
    </ol>
  </div>
</div>
